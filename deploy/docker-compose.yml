# Chạy trên VPS (clone CINEWAVE + cccd_detect_server cạnh nhau):
#   D:/LuanVan  (hoặc ~/cinewave/CINEWAVE)
#   D:/dataset_luanvan/cccd_detect_server
#
#   cd D:/LuanVan/deploy
#   cp .env.vps.example .env   # chỉnh biến
#   docker compose up -d --build
#
# Local dev: chạy AI riêng rồi set AI_SERVICE_URL=http://localhost:8000
#   cd D:/dataset_luanvan/cccd_detect_server && .venv/Scripts/python -m uvicorn app:app --host 0.0.0.0 --port 8000

services:
  ai:
    build:
      context: ../../dataset_luanvan/cccd_detect_server
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  api:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      AI_SERVICE_URL: http://ai:8000
      PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      ai:
        condition: service_healthy

volumes:
  api_uploads:
